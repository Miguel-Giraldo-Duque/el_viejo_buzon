sections:
  hero:
    enabled: true
    lede: Bar y bodegón en Neuquén 1100, Caballito, frente a la cancha de Ferro.
    story: Abrió en 1987, idea de Toto Evangelista, para que trabajara su hermano. La barra es el banco de soldador de su padre, del taller de Neuquén 1080. El buzón rojo fue restaurado y volvió a la esquina.
    quote: Esta es una esquina con magia.
    quote_source: Clarín
    postmark: "Caballito · Neuquén 1100 · frente a Ferro"
    call_label: Llamar al +54 11 5931-9962
    image: /fotos/salon-octubre.jpg
    image_alt: Salón lleno de El Viejo Buzón. Toto está sentado a una mesa y los mozos de camisa verde atienden la barra y las mesas.
    image_width: 4096
    image_height: 2730
    object_position: 42% 78%

  reviews:
    enabled: true
    title: Reseñas
    items:
      - text: "Es un Bar con mucha historia linda de conocer, ubicado en el clasico barrio de Caballito, a pocos metros de la Cancha de Ferro, atendido por su dueno Toto Evangelista que te hace sentir como si estuvieras en tu casa."
        signature: Reseña en carta.menu
        source_label: carta.menu
        url: https://carta.menu/restaurants/buenos-aires/el-viejo-buzon
        date: null
        initial: null
      - text: "Bar pintoresco en caballito. Atención muy buena tanto de los moos y mozas como de su propietario que nos acercó historias del barrio y del museo. Comimos una riquísima picada acompañada de aperitivos en un domingo lluvioso de verano. Recomendable para ir antes o después de visitar el hermoso museo de esculturas, que fue casa de Luis Perlotti. Imperdible!"
        signature: Reseña en carta.menu
        source_label: carta.menu
        url: https://carta.menu/restaurants/buenos-aires/el-viejo-buzon
        date: null
        initial: null
      - text: "Impecable. Lugar notable y emblemático de la zona, con una particular historia que su dueño se anima a contar en las mesas."
        signature: Reseña en carta.menu
        source_label: carta.menu
        url: https://carta.menu/restaurants/buenos-aires/el-viejo-buzon
        date: null
        initial: null
      - text: "Un bodegón con todas las letras. El menú del día era milanesa de pollo con fritas, la cual podías optar hacerla napolitana por una diferencia ínfima de precio. Ri-qui-si-ma. La atención de la moza es excelente, acogedora, simpática."
        signature: Betiana Tetti
        source_label: Google, en Sluurpy
        url: https://www.sluurpy.com/es/buenos-aires/restaurant/2284831/el-viejo-buzon
        date: 27/02/2022
        initial: B
      - text: "Excelente. Una atención personalizada y maravillosa, muy amable que te hacía sentir en familia. Radio en vivo y buena comida. Voy a volver sin dudar."
        signature: Jose Ignacio Sherman
        source_label: Google, en Sluurpy
        url: https://www.sluurpy.com/es/buenos-aires/restaurant/2284831/el-viejo-buzon
        date: 08/10/2023
        initial: J

