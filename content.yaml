  about:
    enabled: false
    title: El lugar
    paragraphs:
      - En la esquina hubo una panadería desde 1910. La panadera fue doña Carmen y el inmueble hoy es de sus nietas. Después funcionó una fiambrería.
      - El bar es Bar Notable desde 2014. La esquina fue declarada histórica en 1993.
      - Toto está a cargo desde 2011, según Clarín, o desde 2012, según La Nación.

